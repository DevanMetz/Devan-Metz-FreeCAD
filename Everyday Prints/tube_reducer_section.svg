   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17343a" x="590.976" y="156.045656" transform="rotate(-0 590.976 156.045656)">Reference tubes</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #277c7c" x="570.24" y="204.2496" transform="rotate(-0 570.24 204.2496)">LARGE END</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #17343a" transform="translate(570.24 231.569337)">50.4 mm socket for a 50 mm tube.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #17343a" transform="translate(570.24 247.003712)">The taper contacts the end after</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #17343a" transform="translate(570.24 264.569337)">22.55 mm of insertion.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #277c7c" x="570.24" y="294.0624" transform="rotate(-0 570.24 294.0624)">SMALL END</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #17343a" transform="translate(570.24 321.382137)">32.4 mm socket for a 32 mm tube.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #17343a" transform="translate(570.24 336.816512)">The flat stop sets 20 mm insertion.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #17343a" transform="translate(570.24 354.382137)">Illustrated tube walls: 2 mm.</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #277c7c" x="570.24" y="388.152" transform="rotate(-0 570.24 388.152)">FIT FIRST</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #17343a" transform="translate(570.24 414.406113)">Print a socket fit ring for each</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #17343a" transform="translate(570.24 431.971738)">measured tube diameter. Clearance</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #17343a" transform="translate(570.24 447.910566)">adds to the whole diameter; the</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #17343a" transform="translate(570.24 463.906113)">default 0.4 mm adds 0.2 mm per side.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #277c7c" x="570.24" y="495.072" transform="rotate(-0 570.24 495.072)">PRINT ORIENTATION</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #17343a" transform="translate(570.24 521.326113)">Large mouth on the bed.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #17343a" transform="translate(570.24 537.826113)">Small socket faces upward.</text>
   </g>
  </g>
